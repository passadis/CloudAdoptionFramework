name: Deploy Content to secops2001 [ef44d627-ea9b-44df-97e2-5aec4102da24]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-ef44d627-ea9b-44df-97e2-5aec4102da24.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ solution-factories ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-ef44d627-ea9b-44df-97e2-5aec4102da24.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'rg-sc200-1'
      workspaceName: 'secops2001'
      workspaceId: 'b92874ba-ccfc-4905-bd96-d00e4d06ed66'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule,AutomationRule,Parser,Playbook'
      branch: 'solution-factories'
      sourceControlId: 'ef44d627-ea9b-44df-97e2-5aec4102da24'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_ef44d627ea9b44df97e25aec4102da24 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_ef44d627ea9b44df97e25aec4102da24 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_ef44d627ea9b44df97e25aec4102da24 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_ef44d627ea9b44df97e25aec4102da24 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_ef44d627ea9b44df97e25aec4102da24 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_ef44d627ea9b44df97e25aec4102da24 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_ef44d627ea9b44df97e25aec4102da24 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_ef44d627ea9b44df97e25aec4102da24 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_ef44d627ea9b44df97e25aec4102da24 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-ef44d627-ea9b-44df-97e2-5aec4102da24.ps1